<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoveConviene – Prototipo</title>
  <!-- Tipografía Inter (la del design system) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Si cambias un .css o .js, sube este número (v=6 → v=7) para que el navegador no use una copia antigua -->
  <link rel="stylesheet" href="styles.css?v=6">
  <link rel="stylesheet" href="components.css?v=6">
</head>
<body>
  <!-- Diseño: Figma "iPhone_HOME - section for favorite retailer's flyers" -->
  <div class="phone">

    <!-- HEADER: status bar + iosTopBar + Tabs -->
    <header class="header">
      <div class="status-bar">
        <span class="status-bar__time">9:27</span>
        <span class="status-bar__ui">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.3c2.3 0 4.4.9 6 2.4l1.1-1.2A10.2 10.2 0 0 0 8 .7 10.2 10.2 0 0 0 .9 3.5L2 4.7a8.6 8.6 0 0 1 6-2.4Zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.1-1.2A7 7 0 0 0 8 4.1a7 7 0 0 0-4.7 1.8l1.1 1.2c1-.9 2.2-1.4 3.6-1.4Zm0 3.3c-.6 0-1.2.2-1.6.6L8 11.3l1.6-1.7c-.4-.4-1-.6-1.6-.6Z"/></svg>
          <svg width="25" height="12" viewBox="0 0 25 12"><rect x=".5" y=".5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity=".35"/><rect x="2" y="2" width="18" height="8" rx="1.5"/><path d="M23 4v4c.8-.3 1.3-1.1 1.3-2S23.8 4.3 23 4Z" opacity=".4"/></svg>
        </span>
      </div>

      <div class="top-bar">
        <button class="top-bar-title">
          Ti trovi a <strong>Bologna - 40138</strong>
          <span class="icon icon--sm" data-icon="expandMore"></span>
        </button>
        <button class="btn-icon top-bar__right" aria-label="Mappa">
          <span class="icon" data-icon="map"></span>
        </button>
      </div>

      <nav class="tabs">
        <button class="tab-line tab-line--selected">Per te</button>
        <button class="tab-line">
          <span class="icon icon--sm" data-icon="community"></span>
          + Risparmio
          <span class="tag tag--teal">Novità</span>
        </button>
      </nav>
    </header>

    <main>
      <!-- BUSCADOR + CATEGORÍAS + MASTHEAD + STORIES -->
      <div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 8px;">
        <label class="search">
          <span class="icon" data-icon="lens"></span>
          <input type="text" placeholder="Cerca prodotti o negozi">
        </label>
        <div class="cat-tabs" id="cat-tabs"></div>
        <div class="masthead">MASTHEAD</div>
        <div class="stories" id="stories"></div>
      </div>

      <!-- Todas las secciones se generan desde app.js -->
      <div id="sections"></div>
    </main>

    <!-- BOTTOM NAV BAR (iosBottomNavBar) -->
    <nav class="bottom-nav">
      <a class="bottom-nav__tab bottom-nav__tab--selected" href="#"><span class="icon" data-icon="home"></span>Home</a>
      <a class="bottom-nav__tab" href="#"><span class="icon" data-icon="heartFill"></span>Preferiti</a>
      <a class="bottom-nav__tab" href="#"><span class="icon" data-icon="card"></span>Carte</a>
      <a class="bottom-nav__tab" href="#"><span class="icon" data-icon="myListFill"></span>La mia lista</a>
      <a class="bottom-nav__tab" href="#"><span class="icon" data-icon="profile"></span>Account</a>
    </nav>

  </div>

  <script src="app.js?v=6"></script>
  <script src="icons.js?v=6"></script>
</body>
</html>
