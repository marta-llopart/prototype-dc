<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoveConviene – Prototipo</title>
  <!-- Tipografía Inter (la del design system) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- Si cambias un .css o .js, sube este número (v=4 → v=5) para que el navegador no use una copia antigua -->
  <link rel="stylesheet" href="styles.css?v=4">
  <link rel="stylesheet" href="components.css?v=4">
</head>
<body>
  <!-- Marco de móvil: todo el prototipo vive dentro -->
  <div class="phone">

    <!-- TOP BAR (iosTopBar + título "ti trovi") -->
    <header class="top-bar">
      <button class="top-bar-title">
        Ti trovi a <strong>Roma</strong>
        <span class="icon icon--sm" data-icon="expandMore"></span>
      </button>
      <button class="btn-icon top-bar__right" aria-label="Notifiche">
        <span class="icon" data-icon="notification"></span>
      </button>
    </header>

    <!-- BUSCADOR -->
    <label class="search">
      <span class="icon" data-icon="lens"></span>
      <input type="text" placeholder="Cerca prodotti, negozi, marche…">
    </label>

    <main class="content">

      <!-- CATEGORÍAS -->
      <section class="section">
        <div class="chips">
          <button class="chip chip--active">Tutti</button>
          <button class="chip">Supermercati</button>
          <button class="chip">Elettronica</button>
          <button class="chip">Casa</button>
          <button class="chip">Profumerie</button>
        </div>
      </section>

      <!-- CARRUSEL DE FOLLETOS (flyerCard) -->
      <section class="section">
        <div class="section__title">
          <h2>Volantini vicino a te</h2>
          <a class="btn btn--ghost btn--small" href="#">Vedi tutti <span class="icon icon--sm" data-icon="chevronRight"></span></a>
        </div>
        <div class="carousel" id="flyers">
          <!-- Las tarjetas se generan desde app.js -->
        </div>
      </section>

      <!-- TIENDAS (cardStore) -->
      <section class="section">
        <div class="section__title">
          <h2>Negozi vicino a te</h2>
          <a class="btn btn--ghost btn--small" href="#">Vedi tutti <span class="icon icon--sm" data-icon="chevronRight"></span></a>
        </div>
        <div class="carousel" id="stores">
          <!-- Se generan desde app.js -->
        </div>
      </section>

      <!-- EJEMPLO DE BOTONES (button) -->
      <section class="section" style="padding: 0 16px; display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn--primary btn--large">Attiva notifiche</button>
        <button class="btn btn--secondary btn--large">Più tardi</button>
      </section>

    </main>

    <!-- BOTTOM NAV BAR (iosBottomNavBar) -->
    <nav class="bottom-nav">
      <a class="bottom-nav__tab bottom-nav__tab--selected" href="#"><span class="icon" data-icon="home"></span>Home</a>
      <a class="bottom-nav__tab" href="#"><span class="icon" data-icon="heartFill"></span>Preferiti</a>
      <a class="bottom-nav__tab" href="#"><span class="icon" data-icon="card"></span>Carte</a>
      <a class="bottom-nav__tab" href="#"><span class="icon" data-icon="myListFill"></span>La mia lista</a>
      <a class="bottom-nav__tab" href="#"><span class="icon" data-icon="profile"></span>Account</a>
    </nav>

  </div>

  <script src="app.js?v=4"></script>
  <script src="icons.js?v=4"></script>
</body>
</html>
